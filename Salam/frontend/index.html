<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>SALAM - Agendamentos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Menu Lateral -->
        <aside class="sidebar">
            <h1 class="logo">SALAM</h1>
            <nav class="side-menu">
                <ul>
                    <li><a href="#">Agendar Serviço</a></li>
                    <li><a href="#">Avaliar Profissionais</a></li>
                    <li><a href="#">Cupons</a></li>
                    <li><a href="#">Agendamentos</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Conteúdo Principal -->
        <div class="main-wrapper">
            <!-- Cabeçalho Topo -->
            <header class="top-header">
                <nav class="top-menu">
                    <a href="#">Serviços</a>
                    <a href="#">Planos</a>
                    <a href="#">Cadastro</a>
                </nav>
            </header>

            <!-- Área de Conteúdo -->
            <main class="content-area">
                <section class="promo-card">
                    <div class="promo-image">
                        <img src="imagem-depilacao.jpg" alt="Promoção de Depilação">
                    </div>
                    <div class="promo-details">
                        <h2>Promoção de Junho</h2>
                        <p class="price">R$ 100</p>
                        <p class="description">Depilação + Unhas (Mão e Pé)</p>
                    </div>
                </section>
                
                <!-- Controles do Carrossel -->
                <div class="carousel-controls">
                    <button class="btn-prev">&lt;</button>
                    <button class="btn-next">&gt;</button>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
