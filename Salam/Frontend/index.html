<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>SALAM - Agendamentos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout-container">
        
        <!-- Menu Lateral Esquerdo -->
        <aside class="sidebar">
            <h1 class="logo">SALAM</h1>
            <nav>
                <ul>
                    <li><a href="#">Agendar Serviço</a></li>
                    <li><a href="#">Avaliar Profissionais</a></li>
                    <li><a href="#">Cupons</a></li>
                    <li><a href="#">Agendamentos</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Lado Direito (Topo + Conteúdo) -->
        <div class="right-panel">
            
            <!-- Barra Superior -->
            <header class="topbar">
                <nav>
                    <a href="#">Serviços</a>
                    <a href="#">Planos</a>
                    <a href="#">Cadastro</a>
                </nav>
            </header>

            <!-- Área Principal (Card de Promoção) -->
            <main class="content">
                <div class="promo-card">
                    <img src="caminho-da-sua-imagem.jpg" alt="Promoção Depilação">
                    <h2>Promoção de Junho</h2>
                    <p class="price">R$ 100</p>
                    <p class="description">Depilação + Unhas (Mão e Pé)</p>
                </div>
                
                <!-- Controles do Carrossel -->
                <div class="carousel-controls">
                    <button id="prev">&lt;</button>
                    <button id="next">&gt;</button>
                </div>
            </main>

        </div>
    </div>
</body>
</html>
